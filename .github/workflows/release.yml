name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native android directory
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: FocusBuddy ${{ github.event.inputs.version }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
            android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            android/app/build/outputs/apk/debug/app-x86_64-debug.apk
